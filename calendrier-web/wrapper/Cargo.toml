[package]
name = "calendrier-web"
version = "0.1.0"
edition = "2024"
description = "Most precise and correct implementation of the French Republican calendar in the world"
repository = "https://github.com/Mubelotix/calendrier"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[features]
default = []
solar = ["calendrier/solar"]

[dependencies]
wasm-bindgen = "0.2"
calendrier = { version="1.1" }

[profile.release]
lto = true
