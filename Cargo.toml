[package]
name = "calendrier"
description = "Crate for handling dates in the french Revolutionary calendar"
authors = ["Mubelotix <mubelotix@gmail.com>"]
repository = "https://github.com/Mubelotix/calendrier"
license = "MIT"
readme = "README.md"
version = "1.0.2"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
chrono = { version = "0.4.42", features = ["serde"], optional = true }

[features]
default = ["chrono"]
chrono = ["dep:chrono"]

[dev-dependencies]
chrono = "0.4.42"

[build-dependencies]
chrono = "0.4.42"
